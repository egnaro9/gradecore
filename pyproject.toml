[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradecore"
version = "0.1.0"
description = "A deterministic, no-LLM-judge grading engine shared by model-drift and the crash-test platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
keywords = ["llm", "eval", "grading", "deterministic", "no-llm-judge"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gradecore"]

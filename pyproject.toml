[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradecore"
version = "0.10.0"
description = "A deterministic, no-LLM-judge grading engine used by the crash-test platform and wire-compatible with model-drift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
keywords = ["llm", "eval", "grading", "deterministic", "no-llm-judge"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Repository = "https://github.com/egnaro9/gradecore"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gradecore"]

[tool.setuptools.package-data]
gradecore = ["py.typed"]

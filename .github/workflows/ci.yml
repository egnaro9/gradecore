name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q      # zero runtime dependencies, on purpose
      # Was scripts/check_readme_test_count.py here until 2026-10-10. Four other
      # repositories held byte-identical copies, so it is a package now. Pinned to a
      # commit, not main: a gate that tracks someone else's default branch is a gate
      # that person can change, and it being me makes that worse rather than better.
      - name: README's advertised test count must match the suite
        run: |
          set -o pipefail
          pip install "git+https://github.com/egnaro9/readme-test-count@6752d7ec7e6177aceff6359905b1d68ab90b546a"
          readme-test-count
      # The paired-test arithmetic has a second implementation in never-touch-ai's
      # harness_core.js. The tests pin the exact values that JS produces, so a
      # divergence fails here rather than surfacing as two surfaces quietly
      # disagreeing about what "better" means.

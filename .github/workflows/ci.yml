name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q      # zero runtime dependencies, on purpose
      - name: README's advertised test count must match the suite
        run: python scripts/check_readme_test_count.py
      # The paired-test arithmetic has a second implementation in never-touch-ai's
      # harness_core.js. The tests pin the exact values that JS produces, so a
      # divergence fails here rather than surfacing as two surfaces quietly
      # disagreeing about what "better" means.
